apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
spec:
  minReadySeconds: 5
  selector:
    matchLabels:
      app: users-svc
  template:
    metadata:
      labels:
        app: users-svc
    spec:
      containers:
      - name: users-svc-con
        image: shaikkhajaibrahim/libuserssvc:1.0
        resources:
          requests:
            memory: 64M
            cpu: 200m
          limits:
            memory: 128M
            cpu: 500m
        env:
          - name: SECRET_KEY
            value: 'YtDEVWnL35aAIP-5yxeLjAZ49R920-mMNDfwPyWULu63HFsYzo0f-LO2InxC8eu428k'
          - name: DATABASE_URL
            value: "postgresql://user:password@usersdb-0.usersdb-svc:5432/usersdb"
        ports:
          - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: users-svc
spec:
  type: ClusterIP
  selector:
    app: users-svc
  ports:
  - port: 8000
    targetPort: 8000
