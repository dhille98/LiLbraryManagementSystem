---
apiVersion: v1
kind: Service
metadata:
  name: usersdb-svc
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    db: booksdb
  ports:
    - port: 5432
      targetPort: 5432
--- 
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: usersdb
spec:
  selector:
    matchLabels:
      db: books
  serviceName: usersdb-svc
  replicas: 2
  template:
    metadata:
      labels:
        db: books
    spec:
      containers:
      - name: usersdb
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
          - name: POSTGRES_USER
            value: user
          - name: POSTGRES_PASSWORD
            value: password
          - name: POSTGRES_DB
            value: usersdb
        resources:
            requests:
              memory: 24M
              cpu: 100m
            limits:
              memory: 128M
              cpu: 500m
        volumeMounts:
        - name: user-pvc
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: user-pvc
    spec:
      accessModes: 
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi


